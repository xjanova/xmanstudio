<!doctype html>
<!-- Home tab — Views/DashboardPage.xaml: logo, status pill, four stat cards, Quick Actions, Your SpiderX ID -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
    .page { background: linear-gradient(135deg, #050510 0%, #0A0A1A 30%, #10051A 70%, #0A1020 100%); padding: 0 24px; }
    .hero { height: 268px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    .logo { width: 96px; height: 96px; border-radius: 30px; padding: 3px; background: linear-gradient(135deg, #7C3AED, #EC4899, #06B6D4); box-shadow: 0 0 34px rgba(124, 58, 237, .55); }
    .logo span { display: flex; width: 100%; height: 100%; border-radius: 27px; align-items: center; justify-content: center; font-size: 48px; background: linear-gradient(135deg, #1A0A2A, #0A1A2A); }
    .title { font-size: 40px; font-weight: 700; line-height: 1; margin-top: 6px; }
    .status { margin-top: 6px; display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 20px; background: #14532D; border: 1px solid #166534; color: #22C55E; font-weight: 700; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .stats .card .n { font-size: 36px; font-weight: 700; margin: 8px 0 2px; }
    .qa { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; margin-top: 14px; }
    .qa .ico { width: 56px; height: 56px; border-radius: 16px; font-size: 26px; }
    .qa div { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #94A3B8; font-size: 12px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
    .idbox { margin-top: 12px; padding: 16px; border-radius: 12px; background: #0A0A1A; border: 1px solid #3A2A5A; display: flex; align-items: center; }
</style></head>
<body data-on="Home">
<div class="page">
    <div class="hero">
        <div class="logo"><span>🕷️</span></div>
        <div class="title">SpiderX</div>
        <div class="sub" style="font-size:16px">Decentralized P2P Mesh Network</div>
        <div class="status"><span class="dot"></span>Online • 4 peers</div>
    </div>
    <div class="stats">
        <div class="card"><div class="row" style="gap:8px"><span class="ico g-violet">👥</span><span class="sub" style="font-size:14px">Peers</span></div><div class="n">4</div><div style="font-size:12px;color:#22C55E">Connected</div></div>
        <div class="card"><div class="row" style="gap:8px"><span class="ico g-pink">💬</span><span class="sub" style="font-size:14px">Messages</span></div><div class="n">128</div><div style="font-size:12px" class="pk">3 unread</div></div>
        <div class="card"><div class="row" style="gap:8px"><span class="ico g-cyan">📁</span><span class="sub" style="font-size:14px">Files</span></div><div class="n">17</div><div style="font-size:12px" class="cy">2.4 GB</div></div>
        <div class="card"><div class="row" style="gap:8px"><span class="ico g-green">📡</span><span class="sub" style="font-size:14px">Network</span></div><div class="n">12ms</div><div style="font-size:12px;color:#22C55E">Avg. Latency</div></div>
    </div>
    <div class="two">
        <div class="card">
            <div style="font-size:18px;font-weight:700">Quick Actions</div>
            <div class="qa">
                <div><span class="ico g-violet">📷</span>Scan</div>
                <div><span class="ico g-pink">🔗</span>Share</div>
                <div><span class="ico g-cyan">📡</span>Discover</div>
                <div><span class="ico g-green">📤</span>Send</div>
            </div>
        </div>
        <div class="card">
            <div class="row" style="gap:8px;font-size:18px;font-weight:700">🔐 Your SpiderX ID</div>
            <div class="idbox"><span class="mono cy" style="font-size:14px">spx1Q7mXc4Rk2VbN9pTzH6eWfLa3JuYd8sGq</span><span style="margin-left:auto;font-size:18px">📋</span></div>
            <div style="text-align:center;font-size:12px;color:#64748B;margin-top:10px">Tap to copy • Share this ID with others to connect</div>
        </div>
    </div>
</div>
<script src="chrome.js"></script>
</body></html>
