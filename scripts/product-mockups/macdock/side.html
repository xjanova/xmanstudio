<!doctype html>
<!-- The dock moved to the left edge (Position on screen → Left, or drag the grip): a vertical bar,
     icons grow to the right, header pills trimmed to the icon width ("…"), the tooltip opens to the right.
     The digital clock is a crop of a real capture; the window is a generic block drawing. -->
<html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
    .clock { position: absolute; z-index: 2; right: 70px; top: 60px; width: 330px; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, .55)); }
</style></head>
<body>
<div class="app" style="left: 300px; top: 230px; width: 900px; height: 560px;">
    <div class="tb"><i></i><i></i><i></i></div>
    <div class="side" id="side"></div>
    <div class="body" id="body"></div>
</div>
<img class="clock" src="assets/clock-digital.png" alt="">
<script src="dock.js"></script>
<script>
(function () {
    var side = document.getElementById('side'), body = document.getElementById('body');
    [70, 55, 82, 60, 48, 75, 66, 52].forEach(function (w) { side.insertAdjacentHTML('beforeend', '<div class="ln" style="width:' + w + '%"></div>'); });
    body.insertAdjacentHTML('beforeend', '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">' +
        Array(12).join('.').split('.').map(function (x, i) {
            var c = ['#4f6bd8', '#8b5cf6', '#0ea5e9', '#14b8a6', '#f59e0b', '#ec4899'][i % 6];
            return '<div style="height:120px;border-radius:10px;background:linear-gradient(150deg,' + c + ',rgba(255,255,255,.04));opacity:.55"></div>';
        }).join('') + '</div>');
})();
MacDock.dock({ edge: 'left', hover: 5, items: [
    { g: 'browser', name: 'Web Browser', run: true }, { g: 'photo', name: 'Photo Viewer', run: true },
    '|',
    { g: 'folder', name: 'Documents' },
    { hdr: 'งานเอกสาร' }, { g: 'notes', name: 'Notes' }, { g: 'sheet', name: 'Spreadsheet' },
    { hdr: 'เพลง & วิดีโอ' }, { g: 'music', name: 'Music Player' }, { g: 'video', name: 'Video Player' },
    { hdr: 'เครื่องมือ', col: true },
] });
</script>
</body></html>
