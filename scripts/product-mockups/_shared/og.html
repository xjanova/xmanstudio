<!doctype html>
<!-- The 1200×630 social preview of a product page: its key art, its name, one line.
     Everything comes from the query: art (path from this file), name, glow (the part of the
     name drawn in the gradient), line, sub, c1/c2/c3 (gradient colours, no #). No price: previews
     are cached for weeks by the apps that show them. -->
<html lang="th"><head><meta charset="utf-8">
<style>
    @font-face { font-family: Kanit; src: url(../_fonts/Kanit-Bold.ttf); font-weight: 700; }
    @font-face { font-family: NotoThai; src: url(../_fonts/NotoSansThai-600.ttf); font-weight: 600; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #04060d; }
    .art { position: absolute; right: -60px; top: -20px; width: 1040px; height: 693px; background-size: cover; background-position: center; }
    .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #04060d 0%, rgba(4, 6, 13, .92) 30%, rgba(4, 6, 13, .2) 62%, transparent 100%); }
    .txt { position: absolute; left: 72px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
    .brand { font-family: NotoThai; font-size: 20px; letter-spacing: .3em; color: #8fa3c8; margin-bottom: 18px; }
    h1 { font-family: Kanit; font-size: 112px; line-height: .95; color: #fff; letter-spacing: -.01em; }
    h1 span { background: linear-gradient(92deg, var(--c1), var(--c2) 45%, var(--c3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .line { font-family: NotoThai; font-weight: 600; font-size: 38px; line-height: 1.3; color: #fff; margin-top: 26px; }
    .sub { font-family: NotoThai; font-weight: 600; font-size: 24px; color: #b8c4da; margin-top: 18px; }
</style></head>
<body>
<div class="art" id="art"></div><div class="shade"></div>
<div class="txt">
    <p class="brand">XMAN STUDIO</p>
    <h1 id="name"></h1>
    <p class="line" id="line"></p>
    <p class="sub" id="sub"></p>
</div>
<script>
    var q = new URLSearchParams(location.search);
    var name = q.get('name') || '', glow = q.get('glow') || '';
    var at = glow ? name.lastIndexOf(glow) : -1;
    var h = document.getElementById('name');
    if (at >= 0) {
        h.append(name.slice(0, at));
        var s = document.createElement('span'); s.textContent = glow; h.append(s);
        h.append(name.slice(at + glow.length));
    } else { h.textContent = name; }
    // "|" marks where the line may break: Chromium breaks Thai mid-word otherwise
    (q.get('line') || '').split('|').forEach(function (part) {
        var s = document.createElement('span'); s.textContent = part; s.style.whiteSpace = 'nowrap'; s.style.display = 'block';
        document.getElementById('line').append(s);
    });
    document.getElementById('sub').textContent = q.get('sub') || '';
    document.getElementById('art').style.backgroundImage = 'url("' + q.get('art') + '")';
    ['c1', 'c2', 'c3'].forEach(function (k) { document.documentElement.style.setProperty('--' + k, '#' + (q.get(k) || 'ffffff')); });
</script>
</body></html>
