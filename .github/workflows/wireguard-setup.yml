name: WireGuard VPN Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - setup-wireguard
          - wireguard-status
          - wireguard-restart
          - add-server
      server_name:
        description: 'Server name (for add-server)'
        required: false
        default: 'wg-server-1'
      country_code:
        description: 'Country code, e.g. SG (for add-server)'
        required: false
        default: 'SG'
      country_name:
        description: 'Country name, e.g. Singapore (for add-server)'
        required: false
        default: 'Singapore'
      port:
        description: 'WireGuard listen port (for add-server/setup-wireguard)'
        required: false
        default: '51820'
      interface:
        description: 'WireGuard interface name (for add-server/setup-wireguard)'
        required: false
        default: 'wg0'
      address:
        description: 'Server WireGuard address CIDR (for add-server)'
        required: false
        default: '10.20.0.1/24'
      max_clients:
        description: 'Maximum clients (for add-server)'
        required: false
        default: '250'
      net_interface:
        description: 'Network interface for NAT (for setup-wireguard/add-server)'
        required: false
        default: 'eth0'

# The secrets file below has one fixed path, so two runs at once would delete
# each other's copy.
concurrency:
  group: wireguard-setup
  cancel-in-progress: false

jobs:
  wireguard:
    name: "WireGuard: ${{ inputs.action }}"
    runs-on: ubuntu-latest

    steps:
      # Never pass a secret through ssh-action's `envs:`. It prepends them to the
      # script as `export KEY='value'` lines and sends the lot as the SSH exec
      # command, so sshd runs `bash -c '<script>'` and the values can be read from
      # ps for the whole run, on a server shared with other sites. Plain ssh
      # carries the root password on stdin, which no command line sees. The script
      # reads this file and deletes it before it does anything else.
      - name: Send root password to the server over stdin
        timeout-minutes: 2
        env:
          SUDO_PASS: ${{ secrets.SUDO_PASS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          eval "$(ssh-agent -s)" > /dev/null
          trap 'ssh-agent -k > /dev/null' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -q -
          printf '%s\0' "$SUDO_PASS" | ssh -T -p "$SSH_PORT" \
            -o BatchMode=yes -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR \
            "$SSH_USER@$SSH_HOST" 'umask 077 && cat > "$HOME/.xmanstudio-wireguard-secrets"'

      - name: Execute via SSH
        uses: appleboy/ssh-action@v1
        env:
          WG_ACTION: ${{ inputs.action }}
          WG_SERVER_NAME: ${{ inputs.server_name }}
          WG_COUNTRY_CODE: ${{ inputs.country_code }}
          WG_COUNTRY_NAME: ${{ inputs.country_name }}
          WG_PORT: ${{ inputs.port }}
          WG_INTERFACE: ${{ inputs.interface }}
          WG_ADDRESS: ${{ inputs.address }}
          WG_MAX_CLIENTS: ${{ inputs.max_clients }}
          WG_NET_INTERFACE: ${{ inputs.net_interface }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          envs: WG_ACTION,WG_SERVER_NAME,WG_COUNTRY_CODE,WG_COUNTRY_NAME,WG_PORT,WG_INTERFACE,WG_ADDRESS,WG_MAX_CLIENTS,WG_NET_INTERFACE,DEPLOY_PATH
          script: |
            # The root password from the step above. Not exported, so nothing this
            # script starts inherits it.
            SECRETS_FILE="$HOME/.xmanstudio-wireguard-secrets"
            SUDO_PASS=""
            if [ -f "$SECRETS_FILE" ]; then
              IFS= read -r -d '' SUDO_PASS < "$SECRETS_FILE" || true
              rm -f "$SECRETS_FILE"
            fi

            ACTION="${WG_ACTION}"
            echo "=============================="
            echo "Action: $ACTION"
            echo "Time: $(date)"
            echo "User: $(whoami)"
            echo "=============================="

            # SUDO_PASS is the root password, use su -c instead of sudo
            if [ -n "$SUDO_PASS" ]; then
              echo "ROOT_PASS: set"
            else
              echo "ROOT_PASS: NOT SET"
            fi

            # Run command as root using su -c with root password
            do_sudo() {
              if [ -n "$SUDO_PASS" ]; then
                echo "$SUDO_PASS" | su -c "$*" root 2>&1
              else
                sudo "$@" 2>&1
              fi
            }

            # Project directory (use DEPLOY_PATH secret, fallback to common paths)
            PROJECT_DIR="${DEPLOY_PATH:-/var/www/xmanstudio}"
            if [ ! -d "$PROJECT_DIR" ]; then
              for p in /home/*/domains/*/public_html /var/www/html; do
                if [ -f "$p/artisan" ]; then
                  PROJECT_DIR="$p"
                  break
                fi
              done
            fi
            echo "Project dir: $PROJECT_DIR"
            cd "$PROJECT_DIR" || { echo "ERROR: Project directory not found"; exit 1; }

            echo "=== Pulling latest code ==="
            git pull origin main --ff-only 2>&1 || echo "WARNING: git pull failed"
            php artisan route:clear 2>/dev/null || true
            php artisan config:clear 2>/dev/null || true

            case "$ACTION" in
              setup-wireguard)
                echo "=== Testing sudo ==="
                do_sudo whoami || { echo "ERROR: Cannot run as root"; exit 1; }

                echo "=== Setting up sudoers for wg commands ==="
                CURRENT_USER=$(whoami)
                PHP_USER=$(php -r "echo exec('whoami');" 2>/dev/null || echo "unknown")
                echo "SSH user: ${CURRENT_USER}, PHP user: ${PHP_USER}"
                WG_SUDOERS="/etc/sudoers.d/wireguard"
                printf '%s ALL=(root) NOPASSWD: /usr/bin/wg, /usr/bin/wg-quick\n' "${CURRENT_USER}" > /tmp/wg_sudoers
                if [ "${PHP_USER}" != "${CURRENT_USER}" ] && [ "${PHP_USER}" != "unknown" ]; then
                  printf '%s ALL=(root) NOPASSWD: /usr/bin/wg, /usr/bin/wg-quick\n' "${PHP_USER}" >> /tmp/wg_sudoers
                fi
                printf 'www-data ALL=(root) NOPASSWD: /usr/bin/wg, /usr/bin/wg-quick\n' >> /tmp/wg_sudoers
                do_sudo cp /tmp/wg_sudoers "$WG_SUDOERS"
                do_sudo chmod 440 "$WG_SUDOERS"
                rm -f /tmp/wg_sudoers
                echo "Sudoers rules:"
                do_sudo cat "$WG_SUDOERS"

                echo "=== Installing WireGuard ==="
                do_sudo apt-get update -qq && do_sudo apt-get install -y -qq wireguard || echo "WARNING: Could not install WireGuard"

                echo "=== Creating /etc/wireguard ==="
                do_sudo mkdir -p /etc/wireguard

                echo "=== Enabling IP forwarding ==="
                do_sudo sysctl -w net.ipv4.ip_forward=1 || echo "WARNING: Could not enable IP forwarding"
                do_sudo sed -i 's/#net.ipv4.ip_forward=1/net.ipv4.ip_forward=1/' /etc/sysctl.conf || true
                grep -q '^net.ipv4.ip_forward=1' /etc/sysctl.conf 2>/dev/null || echo 'net.ipv4.ip_forward=1' | do_sudo tee -a /etc/sysctl.conf || true
                do_sudo sysctl -p || true

                echo "=== Generating WireGuard keys ==="
                WG_PRIVKEY=$(wg genkey)
                WG_PUBKEY=$(echo "$WG_PRIVKEY" | wg pubkey)
                echo "Public Key: $WG_PUBKEY"

                echo "=== Writing WireGuard config ==="
                WG_CONF="/etc/wireguard/${WG_INTERFACE}.conf"
                TMPCONF=$(mktemp /tmp/wg_conf.XXXXXX)
                printf '[Interface]\nAddress = %s\nListenPort = %s\nPrivateKey = %s\nPostUp = iptables -A FORWARD -i %s -j ACCEPT; iptables -t nat -A POSTROUTING -o %s -j MASQUERADE\nPostDown = iptables -D FORWARD -i %s -j ACCEPT; iptables -t nat -D POSTROUTING -o %s -j MASQUERADE\n' \
                  "${WG_ADDRESS}" "${WG_PORT}" "${WG_PRIVKEY}" "${WG_INTERFACE}" "${WG_NET_INTERFACE}" "${WG_INTERFACE}" "${WG_NET_INTERFACE}" > "$TMPCONF"
                do_sudo cp "$TMPCONF" "$WG_CONF"
                do_sudo chmod 600 "$WG_CONF"
                rm -f "$TMPCONF"
                echo "Config written to $WG_CONF"

                echo "=== Starting WireGuard ==="
                do_sudo systemctl enable "wg-quick@${WG_INTERFACE}" || true
                do_sudo systemctl restart "wg-quick@${WG_INTERFACE}" || do_sudo wg-quick up "${WG_INTERFACE}" || echo "WARNING: Could not start WireGuard"
                sleep 2

                echo "=== Removing existing DB record (if any) ==="
                php artisan tinker --execute="
                  \App\Models\WireguardServer::where('name', '${WG_SERVER_NAME}')->delete();
                  echo \"Cleaned up existing records\n\";
                " 2>/dev/null || true

                echo "=== Creating DB record ==="
                printf '%s\n' "$WG_PRIVKEY" | php artisan wireguard:setup \
                  --name="${WG_SERVER_NAME}" \
                  --country="${WG_COUNTRY_CODE}" \
                  --country-name="${WG_COUNTRY_NAME}" \
                  --port="${WG_PORT}" \
                  --interface="${WG_INTERFACE}" \
                  --address="${WG_ADDRESS}" \
                  --max-clients="${WG_MAX_CLIENTS}" \
                  --public-key="$WG_PUBKEY" \
                  --private-key-stdin \
                  --db-only || { echo "ERROR: Could not create DB record"; exit 1; }

                echo "=== Verifying ==="
                do_sudo wg show "${WG_INTERFACE}" || echo "WARNING: Interface not showing"
                echo "=== DONE ==="
                ;;

              wireguard-status)
                echo "=== System Info ==="
                echo "SSH User: $(whoami)"
                echo "PHP User: $(php -r "echo exec('whoami');" 2>/dev/null)"
                echo "Groups: $(groups)"
                echo "Sudoers wg rules:"
                do_sudo cat /etc/sudoers.d/wireguard 2>/dev/null || echo "No wireguard sudoers file"

                echo ""
                echo "=== PHP sudo wg test ==="
                php artisan tinker --execute="
                  \$r = \Illuminate\Support\Facades\Process::run('sudo wg show');
                  echo 'Exit: '.\$r->exitCode().PHP_EOL;
                  echo 'Out: '.\$r->output().PHP_EOL;
                  echo 'Err: '.\$r->errorOutput().PHP_EOL;
                " 2>/dev/null || echo "Tinker test failed"

                echo "=== Shell sudo wg test ==="
                sudo wg show 2>&1 || echo "Shell sudo wg failed"

                echo ""
                echo "=== WireGuard Installation ==="
                which wg 2>/dev/null && echo "wg binary: $(which wg)" || echo "wg binary: NOT FOUND"
                dpkg -l wireguard 2>/dev/null | grep -E "^ii" || echo "wireguard package: NOT INSTALLED"
                do_sudo ls -la /etc/wireguard/ || echo "/etc/wireguard/: NOT FOUND"

                echo ""
                echo "=== WireGuard Live Status ==="
                do_sudo wg show || echo "Cannot run wg show"

                echo ""
                echo "=== Network Interfaces ==="
                ip link show 2>/dev/null | grep -E "wg|tun" || echo "No WireGuard/tun interfaces found"
                ip addr show wg0 2>/dev/null || echo "wg0 interface: NOT FOUND"

                echo ""
                echo "=== IP Forwarding ==="
                cat /proc/sys/net/ipv4/ip_forward 2>/dev/null || echo "Cannot read"

                echo ""
                echo "=== Firewall (port 51820) ==="
                do_sudo iptables -L -n 2>/dev/null | grep -i "51820" || echo "No iptables rules for 51820"

                echo ""
                echo "=== systemctl status ==="
                do_sudo systemctl status wg-quick@wg0 --no-pager || true

                echo ""
                echo "=== Database servers ==="
                php artisan tinker --execute="
                  \$servers = \App\Models\WireguardServer::all();
                  if (\$servers->isEmpty()) { echo \"No servers in database\n\"; }
                  foreach (\$servers as \$s) {
                    echo \$s->name . ' (' . \$s->country_code . ') - ' . \$s->endpoint . ' - Active: ' . (\$s->is_active ? 'Y' : 'N') . ' Healthy: ' . (\$s->is_healthy ? 'Y' : 'N') . ' Clients: ' . \$s->clients()->count() . '/' . \$s->max_clients . \"\n\";
                  }
                " 2>/dev/null || true
                echo "=== DONE ==="
                ;;

              wireguard-restart)
                echo "=== Restarting WireGuard ==="
                IFACE="${WG_INTERFACE:-wg0}"
                do_sudo systemctl restart "wg-quick@${IFACE}"
                sleep 2
                do_sudo wg show "${IFACE}" || echo "WARNING: Interface not showing after restart"
                echo "=== DONE ==="
                ;;

              add-server)
                echo "=== Adding WireGuard server via artisan ==="
                php artisan wireguard:setup \
                  --name="${WG_SERVER_NAME}" \
                  --country="${WG_COUNTRY_CODE}" \
                  --country-name="${WG_COUNTRY_NAME}" \
                  --port="${WG_PORT}" \
                  --interface="${WG_INTERFACE}" \
                  --address="${WG_ADDRESS}" \
                  --max-clients="${WG_MAX_CLIENTS}" \
                  --net-interface="${WG_NET_INTERFACE}" \
                  --db-only
                echo "=== DONE ==="
                ;;

              *)
                echo "ERROR: Unknown action: $ACTION"
                exit 1
                ;;
            esac

      # The script deletes the file as it starts. This is for a run that stopped
      # before the script got that far.
      - name: Remove secrets file from the server
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: rm -f "$HOME/.xmanstudio-wireguard-secrets"
